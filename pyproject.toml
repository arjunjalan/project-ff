[project]
name = "project-ff"
version = "0.1.0"
description = "Personal agent system for running Arjun's ESPN fantasy football league"
requires-python = ">=3.12"
dependencies = [
    "espn-api>=0.46.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
