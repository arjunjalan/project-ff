<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>project-ff</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    button { font: inherit; padding: 0.4rem 0.8rem; margin-right: 0.5rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; white-space: pre-wrap; }
    #status { font-weight: bold; }
    hr { margin: 2rem 0; }
    .item { border-bottom: 1px solid #eee; padding: 0.75rem 0; }
    .item.material { border-left: 3px solid #c0392b; padding-left: 0.75rem; }
    .item .title { font-weight: 600; }
    .item .reason { color: #555; font-size: 0.9em; }
    .badge { font-size: 0.75em; padding: 0.1rem 0.4rem; border-radius: 3px; background: #eee; }
    .badge.material { background: #c0392b; color: white; }
  </style>
</head>
<body>
  <h1>project-ff</h1>
  <p>Status: <span id="status">checking…</span></p>

  <label>Year: <input id="year" type="number" value="2025" /></label>
  <button id="sync">Sync league</button>
  <button id="view">View league</button>

  <pre id="output"></pre>

  <hr />

  <h2>Research feed</h2>
  <p>Materiality-filtered NFL news — reasoning shown for every call.</p>
  <button id="load-feed">Load feed</button>
  <div id="feed"></div>

  <script>
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const yearEl = document.getElementById("year");

    fetch("/health")
      .then((r) => r.json())
      .then((d) => (statusEl.textContent = d.status))
      .catch(() => (statusEl.textContent = "unreachable"));

    async function showResult(promise) {
      outputEl.textContent = "loading…";
      try {
        const r = await promise;
        const data = await r.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        outputEl.textContent = "Error: " + e;
      }
    }

    document.getElementById("sync").addEventListener("click", () => {
      showResult(fetch(`/league/${yearEl.value}/sync`, { method: "POST" }));
    });

    document.getElementById("view").addEventListener("click", () => {
      showResult(fetch(`/league/${yearEl.value}`));
    });

    const feedEl = document.getElementById("feed");

    document.getElementById("load-feed").addEventListener("click", async () => {
      feedEl.textContent = "loading…";
      try {
        const r = await fetch("/research/feed");
        const assessments = await r.json();
        feedEl.innerHTML = assessments
          .map(
            (a) => `
          <div class="item ${a.material ? "material" : ""}">
            <span class="badge ${a.material ? "material" : ""}">${a.material ? "MATERIAL" : "routine"}</span>
            <div class="title"><a href="${a.item.link}" target="_blank">${a.item.title}</a></div>
            <div class="reason">${a.reason}</div>
          </div>`
          )
          .join("");
      } catch (e) {
        feedEl.textContent = "Error: " + e;
      }
    });
  </script>
</body>
</html>
